version: 2
updates:
  - package-ecosystem: npm
    directory: /.github/scripts
    schedule:
      interval: weekly
    # Only propose versions that have been out for two weeks, so freshly published (possibly compromised) releases are skipped.
    cooldown:
      default-days: 14
    groups:
      build-dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ['*']
