<!doctype html>
<html lang="nl">

<head>
    <base href="/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <title>Assistance Online - Status</title>
    <meta name="description" content="Actuele status, storingen en gepland onderhoud van Assistance Online.">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Assistance Online">
    <meta property="og:title" content="Assistance Online - Status">
    <meta property="og:description" content="Actuele status, storingen en gepland onderhoud van Assistance Online.">
    <meta property="og:url" content="https://status.assistanceonline.nl/">
    <meta property="og:image" content="https://status.assistanceonline.nl/images/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="nl_NL">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" id="favicon">
    <link rel="alternate" type="application/atom+xml" title="Assistance Online - Status" href="feed.xml">

    <script src="scripts/i18n.js"></script>
    <script src="scripts/theme.js"></script>

    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="stylesheets/main.css">

    <script src="scripts/main.js" defer></script>
</head>

<body>
    <div class="wrapper">
        <nav class="navbar">
            <div class="container">
                <a href="https://berger.assistanceonline.nl">
                    <img src="images/ao-logo-small.svg" alt="Assistance Online">
                </a>

                <div class="nav-actions">
                    <a href="contact.html" class="nav-link">
                        <i class="fas fa-envelope" aria-hidden="true"></i>
                        <span data-i18n="nav.contact">Contact</span>
                    </a>
                    <button type="button" class="nav-link nav-button" id="language-toggle">EN</button>
                    <button type="button" class="nav-link nav-button" id="theme-toggle" aria-label="Donkere modus">
                        <i class="fas fa-moon" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </nav>

        <main class="container pt-5 pb-4">

            <!-- Algemene systeem status; the skeleton blocks are replaced once status.json is loaded -->
            <section class="hero status-loading" id="system-status" role="status" aria-live="polite">
                <div class="hero-icon skeleton"></div>
                <div class="hero-text">
                    <h1 class="hero-title"><span class="skeleton skeleton-text" data-i18n="status.loading">Bezig met laden ...</span></h1>
                    <p class="hero-meta"><span data-i18n="meta.lastUpdated">Laatst bijgewerkt:</span> <span id="last-updated">-</span></p>
                </div>
            </section>
            <div class="stale-warning" id="stale-warning" role="alert" hidden>
                <i class="fas fa-exclamation-circle" aria-hidden="true"></i> <span></span>
            </div>

            <!-- Status en beschikbaarheid per onderdeel, gegroepeerd -->
            <div class="groups" id="status-items">
                <div class="card group-skeleton skeleton"></div>
                <div class="card group-skeleton skeleton"></div>
            </div>
            <p class="page-meta" data-i18n="meta.filterHint">Klik op een onderdeel om alleen de meldingen daarvan te tonen.</p>

            <div class="filter-info" id="filter-info" hidden>
                <i class="fas fa-filter" aria-hidden="true"></i>
                <span data-i18n="filter.label">Meldingen voor</span> <strong id="filter-name"></strong>
                <button type="button" class="btn btn-sm btn-outline-secondary ms-2" id="filter-clear">
                    <i class="fas fa-times" aria-hidden="true"></i> <span data-i18n="filter.clear">Filter wissen</span>
                </button>
            </div>

            <section id="planned-section" hidden>
                <h2 class="section-title"><span data-i18n="section.planned">Gepland</span> (<span id="planned-count">0</span>)</h2>
                <div id="planned-issues" class="issue-list"></div>
            </section>

            <section>
                <h2 class="section-title"><span data-i18n="section.current">Actueel</span><span id="current-count-wrap" hidden>
                    (<span id="current-count">0</span>)</span></h2>
                <div id="current-issues" class="issue-list"></div>
            </section>

            <section>
                <h2 class="section-title" data-i18n="section.history">Geschiedenis</h2>
                <div class="history-search">
                    <i class="fas fa-search" aria-hidden="true"></i>
                    <input type="search" class="form-control" id="history-search" autocomplete="off"
                        data-i18n-placeholder="search.placeholder" data-i18n-aria-label="search.label"
                        placeholder="Zoek op titel, ticketnummer of tekst" aria-label="Zoeken in de geschiedenis">
                </div>
                <div id="history-issues" class="history"></div>
                <div id="history-sentinel" class="history-sentinel" hidden>
                    <i class="fas fa-sync fa-spin" aria-hidden="true"></i> <span data-i18n="section.loadMore">Meer laden ...</span>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <div class="container">
                <a href="contact.html"><i class="fas fa-envelope" aria-hidden="true"></i> <span data-i18n="nav.contact">Contact</span></a>
                <a href="https://help.assistanceonline.nl"><i class="fas fa-life-ring" aria-hidden="true"></i> <span data-i18n="footer.help">Documentatie &amp; Support</span></a>
                <a href="feed.xml"><i class="fas fa-rss" aria-hidden="true"></i> <span data-i18n="meta.feed">RSS-feed</span></a>
                <a href="agenda.ics"><i class="fas fa-calendar-alt" aria-hidden="true"></i> <span data-i18n="meta.calendar">Agenda</span></a>
                <span class="copyright">&copy; RGB+ Automatisering</span>
            </div>
        </footer>
    </div>

    <button type="button" class="back-to-top" id="back-to-top" data-i18n-aria-label="nav.backToTop" aria-label="Terug naar boven" hidden>
        <i class="fas fa-arrow-up" aria-hidden="true"></i>
    </button>
</body>

</html>
