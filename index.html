<!doctype html>
<html lang="nl">

<head>
    <base href="/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assistance Online - Status</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
        integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&display=swap">

    <link rel="stylesheet" href="stylesheets/main.css">

    <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"
        integrity="sha384-GP2+CwBlakZSDJUr+E4JvbxpM75i1i8+RKkieQxzuyDZLG+5105E1OfHIjzcXyWH" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"
        integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx" crossorigin="anonymous" defer></script>
    <script src="scripts/main.js" defer></script>
</head>

<body>
    <div class="wrapper">
        <nav class="navbar">
            <div class="container">
                <a href="https://berger.assistanceonline.nl">
                    <img src="images/ao-logo-small.svg" alt="Assistance Online">
                </a>

                <a href="contact.html" class="nav-link">
                    <i class="fas fa-envelope"></i>
                    Contact
                </a>
            </div>
        </nav>

        <div class="container pt-5">

            <!-- Algemene systeem status -->
            <div class="card mb-3" id="system-status">
                <div class="row g-0">
                    <div class="col-sm-1 bg-white">
                        <div class="card-body text-center align-middle text-dark">
                            <i class="fas fa-sync fa-spin fa-lg"></i>
                        </div>
                    </div>
                    <div class="col-sm-11">
                        <div class="card-body align-middle">
                            <h5 class="card-title mb-0">Bezig met laden ...</h5>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Status per onderdeel -->
            <ul class="list-group mb-3" id="status-items"></ul>

            <h1>Actueel (<span id="open-issues-count">0</span>)</h1>
            <dl id="open-issues" class="mb-5"></dl>

            <hr>
            <h1>Geschiedenis</h1>
            <dl id="closed-issues" class="mb-5"></dl>
        </div>
    </div>
</body>

</html>
